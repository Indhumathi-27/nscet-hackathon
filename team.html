<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSCET INNOVATE 24 - Team Details</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <header class="header">
        <div class="header-content">
            <div class="brand-section">
                <img src="College_logo.webp" alt="College Logo" class="brand-logo">
                <div class="brand-title">
                    <h1>NSCET INNOVATE 24</h1>
                    <p>Team Details & Attendance</p>
                </div>
            </div>

            <nav class="nav-links">
                <a href="index.html" class="nav-link">Main Desk</a>
                <a href="dashboard.html" class="nav-link">Analytics</a>
                <a href="import.html" class="nav-link">Import Excel</a>
                <a href="teams.html" class="nav-link">Teams List</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <button class="back-btn" onclick="location.href='teams.html'">
            ← Back to Teams List
        </button>

        <div class="details-card" style="margin-bottom: 20px;">
            <h2 id="teamNo" style="margin-bottom: 15px; color: #1e3a8a;">Loading...</h2>
            <div class="team-info">
                <p><strong>School:</strong> <span id="school"></span></p>
                <p><strong>Project:</strong> <span id="project"></span></p>
            </div>
        </div>

        <div class="details-card" style="margin-bottom: 20px;">
            <h3 style="margin-bottom: 16px;">Team Members</h3>
            <div id="members">
                Loading...
            </div>
        </div>

        <button class="overall-report-btn" onclick="generateReport()" style="padding: 12px 24px;">
            Generate Team Report
        </button>
    </main>

    <script type="module" src="js/team.js"></script>
</body>
</html>
