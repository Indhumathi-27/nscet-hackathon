<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSCET INNOVATE 24 - Analytics Dashboard</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <header class="header">
        <div class="header-content">
            <div class="brand-section">
                <div class="brand-icon">🚀</div>
                <div class="brand-title">
                    <h1>NSCET INNOVATE 24</h1>
                    <p>Registration Analytics</p>
                </div>
            </div>

            <nav class="nav-links">
                <a href="index.html" class="nav-link">📊 Main Desk</a>
                <a href="dashboard.html" class="nav-link active">📈 Analytics</a>
                <a href="import.html" class="nav-link">📥 Import Excel</a>
                <a href="teams.html" class="nav-link">📋 Teams List</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="page-title">
            <div>
                <h2>📈 Registration Analytics</h2>
                <p>Live statistics breakdown of teams, check-in status, and participating schools</p>
            </div>
        </div>

        <div class="dashboard">
            <div class="stat-card card-blue">
                <div class="stat-header">
                    <div class="stat-title">Total Teams</div>
                    <div class="stat-icon-wrapper">👥</div>
                </div>
                <div class="stat-number" id="totalTeams">0</div>
            </div>

            <div class="stat-card card-green">
                <div class="stat-header">
                    <div class="stat-title">Arrived Teams</div>
                    <div class="stat-icon-wrapper">✅</div>
                </div>
                <div class="stat-number" id="arrivedTeams">0</div>
            </div>

            <div class="stat-card card-orange">
                <div class="stat-header">
                    <div class="stat-title">Pending Teams</div>
                    <div class="stat-icon-wrapper">⏳</div>
                </div>
                <div class="stat-number" id="pendingTeams">0</div>
            </div>

            <div class="stat-card card-purple">
                <div class="stat-header">
                    <div class="stat-title">Total Students</div>
                    <div class="stat-icon-wrapper">🎓</div>
                </div>
                <div class="stat-number" id="totalStudents">0</div>
            </div>

            <div class="stat-card card-pink">
                <div class="stat-header">
                    <div class="stat-title">Total Schools</div>
                    <div class="stat-icon-wrapper">🏫</div>
                </div>
                <div class="stat-number" id="totalSchools">0</div>
            </div>
        </div>
    </main>

    <script type="module" src="./js/dashboard.js"></script>
</body>
</html>
