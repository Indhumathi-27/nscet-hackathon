<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NSCET INNOVATE 24</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;
            color: #1e293b;
            background: linear-gradient(
                135deg,
                #eef2ff,
                #f8fafc,
                #ecfeff
            );
        }

        button,
        input {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .header {
            padding: 28px 6%;
            color: white;
            background: linear-gradient(
                135deg,
                #312e81,
                #4f46e5,
                #2563eb
            );
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.25);
        }

        .header-content {
            max-width: 1200px;
            margin: auto;
        }

        .header h1 {
            font-size: 30px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .header p {
            margin-top: 6px;
            font-size: 14px;
            opacity: 0.85;
        }

        .container {
            width: 92%;
            max-width: 1200px;
            margin: 35px auto;
        }

        .page-title {
            margin-bottom: 22px;
        }

        .page-title h2 {
            font-size: 25px;
            font-weight: 750;
        }

        .page-title p {
            margin-top: 5px;
            color: #64748b;
            font-size: 14px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 18px;
            margin-bottom: 40px;
        }

        .stat-card {
            position: relative;
            overflow: hidden;
            padding: 22px;
            background: white;
            border: 1px solid rgba(226, 232, 240, 0.8);
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(15, 23, 42, 0.07);
            transition: transform 0.25s, box-shadow 0.25s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 14px 30px rgba(15, 23, 42, 0.12);
        }

        .stat-card::after {
            position: absolute;
            top: -25px;
            right: -25px;
            width: 70px;
            height: 70px;
            background: currentColor;
            border-radius: 50%;
            opacity: 0.12;
            content: "";
        }

        .stat-icon {
            margin-bottom: 12px;
            font-size: 25px;
        }

        .stat-title {
            color: #64748b;
            font-size: 13px;
            font-weight: 600;
        }

        .stat-number {
            margin-top: 5px;
            font-size: 32px;
            font-weight: 800;
        }

        .card-blue {
            color: #2563eb;
        }

        .card-green {
            color: #16a34a;
        }

        .card-orange {
            color: #ea580c;
        }

        .card-purple {
            color: #7c3aed;
        }

        .card-pink {
            color: #db2777;
        }

        .teams-section {
            padding: 25px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(15, 23, 42, 0.07);
        }

        .teams-header,
        .team-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 20px;
        }

        .teams-header h2,
        .team-header h2 {
            font-size: 22px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .live-badge {
            padding: 7px 13px;
            color: #4338ca;
            background: #eef2ff;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }

        .overall-report-btn,
        .view-btn,
        .report-btn,
        .add-team-btn,
        .add-member-btn,
        .save-team-btn {
            border: none;
            color: white;
            font-weight: 700;
        }

        .overall-report-btn,
        .view-btn,
        .report-btn,
        .add-team-btn {
            background: linear-gradient(
                135deg,
                #7c3aed,
                #4f46e5,
                #2563eb
            );
        }

        .overall-report-btn {
            padding: 11px 17px;
            border-radius: 10px;
            font-size: 13px;
            box-shadow: 0 5px 15px rgba(79, 70, 229, 0.25);
        }

        .table-wrapper {
            overflow-x: auto;
        }

        .teams-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }

        .teams-table th {
            padding: 15px;
            color: #64748b;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            font-size: 12px;
            letter-spacing: 0.5px;
            text-align: left;
            text-transform: uppercase;
        }

        .teams-table th:first-child {
            border-radius: 10px 0 0 0;
        }

        .teams-table th:last-child {
            border-radius: 0 10px 0 0;
        }

        .teams-table td {
            padding: 17px 15px;
            border-bottom: 1px solid #f1f5f9;
            font-size: 14px;
        }

        .teams-table tbody tr:hover {
            background: #f8faff;
        }

        .team-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 12px;
            color: #4338ca;
            background: #eef2ff;
            border-radius: 9px;
            font-size: 13px;
            font-weight: 750;
        }

        .team-dot {
            width: 8px;
            height: 8px;
            background: #6366f1;
            border-radius: 50%;
        }

        .member-count {
            display: inline-block;
            padding: 6px 11px;
            color: #475569;
            background: #f1f5f9;
            border-radius: 8px;
            font-weight: 700;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 750;
        }

        .completed {
            color: #15803d;
            background: #dcfce7;
        }

        .partial {
            color: #b45309;
            background: #fef3c7;
        }

        .pending {
            color: #dc2626;
            background: #fee2e2;
        }

        .view-btn {
            padding: 9px 17px;
            border-radius: 9px;
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.2);
        }

        .details-card,
        .add-team-card {
            padding: 30px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(15, 23, 42, 0.08);
        }

        .back-btn,
        .cancel-team-btn {
            padding: 9px 15px;
            color: #475569;
            background: #f1f5f9;
            border: none;
            border-radius: 8px;
            font-weight: 700;
        }

        .back-btn {
            margin-bottom: 20px;
        }

        .team-info {
            margin: 20px 0;
            padding: 18px;
            background: linear-gradient(
                135deg,
                #eef2ff,
                #eff6ff
            );
            border-radius: 12px;
        }

        .team-info p + p {
            margin-top: 8px;
        }

        .member {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 10px;
            padding: 16px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
        }

        .member-name {
            font-weight: 750;
        }

        .member-id {
            margin-top: 4px;
            color: #64748b;
            font-size: 12px;
        }

        .arrived {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #15803d;
            font-weight: 700;
            white-space: nowrap;
        }

        .arrived input {
            width: 19px;
            height: 19px;
        }

        .report-btn {
            margin-top: 20px;
            padding: 11px 20px;
            border-radius: 9px;
        }

        .form-subtitle {
            margin: 8px 0 25px;
            color: #64748b;
        }

        .form-section {
            margin-bottom: 25px;
            padding: 20px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
        }

        .form-section h3 {
            margin-bottom: 15px;
        }

        .form-group,
        .member-input > div {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group + .form-group {
            margin-top: 15px;
        }

        label {
            color: #475569;
            font-size: 13px;
            font-weight: 700;
        }

        input {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
        }

        input:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
        }

        .members-form-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 15px;
        }

        .add-member-btn {
            padding: 9px 13px;
            background: #16a34a;
            border-radius: 8px;
        }

        .member-input {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 12px;
            padding: 15px;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
        }

        .form-actions {
            display: flex;
            gap: 10px;
        }

        .save-team-btn {
            padding: 11px 18px;
            background: #2563eb;
            border-radius: 9px;
        }

        .success-message,
        .firebase-error,
        .empty-message {
            margin-top: 15px;
            padding: 15px;
            border-radius: 10px;
        }

        .success-message {
            color: #15803d;
            background: #dcfce7;
        }

        .firebase-error {
            color: #b91c1c;
            background: #fee2e2;
        }

        .empty-message {
            color: #64748b;
            background: #f8fafc;
        }

        @media (max-width: 1000px) {
            .dashboard {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 650px) {
            .container {
                width: 94%;
                margin-top: 22px;
            }

            .header {
                padding: 22px;
            }

            .header h1 {
                font-size: 22px;
            }

            .dashboard {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .stat-card {
                padding: 17px;
            }

            .stat-number {
                font-size: 27px;
            }

            .teams-section {
                padding: 15px;
            }

            .teams-table {
                min-width: 650px;
            }

            .teams-header,
            .team-header {
                align-items: stretch;
                flex-direction: column;
            }

            .header-actions {
                align-items: stretch;
                flex-direction: column;
            }

            .overall-report-btn {
                width: 100%;
            }

            .member {
                align-items: flex-start;
                flex-direction: column;
            }

            .member-input {
                grid-template-columns: 1fr;
            }

            .members-form-header {
                align-items: stretch;
                flex-direction: column;
            }
        }

        @media (max-width: 400px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
        }

        /* ========================================
   TEAM ACTIONS
======================================== */

.team-actions {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
}


/* ========================================
   DELETE TEAM BUTTON
======================================== */

.delete-team-btn {
    border: none;
    background: #fee2e2;
    color: #dc2626;
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 700;
    transition: 0.2s ease;
}

.delete-team-btn:hover {
    background: #dc2626;
    color: white;
}


/* ========================================
   TEAM DETAIL ACTIONS
======================================== */

.team-detail-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
    flex-wrap: wrap;
}
    </style>
</head>

<body>
    <header class="header">
        <div class="header-content">
            <h1>🚀 NSCET INNOVATE 24</h1>
            <p>Hackathon Registration Desk</p>
        </div>
    </header>

    <main class="container">
        <div class="page-title">
            <h2>📊 Registration Dashboard</h2>
            <p>Live overview of hackathon registrations</p>
        </div>

        <div class="dashboard">
            <div class="stat-card card-blue">
                <div class="stat-icon">👥</div>
                <div class="stat-title">Total Teams</div>
                <div class="stat-number" id="totalTeams">0</div>
            </div>

            <div class="stat-card card-green">
                <div class="stat-icon">✅</div>
                <div class="stat-title">Arrived Teams</div>
                <div class="stat-number" id="arrivedTeams">0</div>
            </div>

            <div class="stat-card card-orange">
                <div class="stat-icon">⏳</div>
                <div class="stat-title">Pending Teams</div>
                <div class="stat-number" id="pendingTeams">0</div>
            </div>

            <div class="stat-card card-purple">
                <div class="stat-icon">🎓</div>
                <div class="stat-title">Total Students</div>
                <div class="stat-number" id="totalStudents">0</div>
            </div>

            <div class="stat-card card-pink">
                <div class="stat-icon">🏫</div>
                <div class="stat-title">Total Schools</div>
                <div class="stat-number" id="totalSchools">0</div>
            </div>
        </div>

        <section class="teams-section">
            <div class="teams-header">
                <div>
                    <h2>📋 Team Registration</h2>
                </div>

                <div class="header-actions">
                    <span class="live-badge">Live Registration</span>

                    <button
                        id="overallReportBtn"
                        class="overall-report-btn"
                        type="button"
                    >
                        📊 Export Overall Report
                    </button>
                </div>
            </div>

            <div
                class="table-wrapper"
                id="teams"
            >
                Loading teams...
            </div>
        </section>
    </main>

    <!-- Important: app.js must be inside the js folder -->
    <script type="module" src="./js/app.js"></script>
</body>
</html>
